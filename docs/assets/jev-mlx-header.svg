<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">JEV MLX</title>
  <desc id="desc">An open source local decision SDK for Apple Silicon. State, language, and allowed choices converge into one decision.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#142c26"/>
      <stop offset="1" stop-color="#0d1e1b"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#63897a" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#b8dac7"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="20" fill="url(#background)"/>
  <rect x="1" y="1" width="1278" height="318" rx="19" fill="none" stroke="#365047"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="62" y="65" fill="#aac6b6" font-size="16" font-weight="600" letter-spacing="3">THE LOCAL DECISION SDK</text>
    <text x="56" y="183" fill="#f3f5ed" font-size="98" font-weight="700" letter-spacing="-5">JEV</text>
    <text x="270" y="183" fill="#b8dac7" font-size="98" font-weight="700" letter-spacing="-5">MLX</text>
    <text x="62" y="246" fill="#b1c2b7" font-size="21">State. Language. One allowed choice.</text>
    <text x="62" y="286" fill="#7e9b8e" font-size="14" letter-spacing="1.2">PYTHON SDK   /   OFFICIAL MLX-LM   /   MIT LICENSE</text>
  </g>
  <g fill="none" stroke="url(#signal)" stroke-width="2">
    <path d="M 842 85 H 900 Q 930 85 950 118 L 980 160"/>
    <path d="M 812 160 H 980"/>
    <path d="M 842 235 H 900 Q 930 235 950 202 L 980 160"/>
    <path d="M 1030 160 H 1144"/>
  </g>
  <g fill="#162f28" stroke="#739b87" stroke-width="1.5">
    <circle cx="838" cy="85" r="6"/>
    <circle cx="808" cy="160" r="6"/>
    <circle cx="838" cy="235" r="6"/>
  </g>
  <circle cx="1004" cy="160" r="25" fill="#b8dac7"/>
  <path d="m 994 160 7 7 13 -14" fill="none" stroke="#18332a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m 1135 154 9 6 -9 6" fill="none" stroke="#b8dac7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1171" cy="160" r="9" fill="#ebbc8b"/>
  <g font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" fill="#8dad9b" font-size="13">
    <text x="861" y="74">state</text>
    <text x="830" y="149">utterance</text>
    <text x="861" y="262">candidates</text>
    <text x="1140" y="200" fill="#ebbc8b">choice</text>
  </g>
