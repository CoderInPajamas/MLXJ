<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
<title id="title">MLXJ — 本地语义决策，为 Apple Silicon 而构建。</title>
<desc id="desc">Candidate project identity. MLX and J share a wordmark. A schematic connects application state and a sentence to an allowed action. The drawing is illustrative, not a recorded inference.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102c27"/><stop offset="1" stop-color="#091c19"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#96e9b6" stop-opacity=".13"/><stop offset="1" stop-color="#96e9b6" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#b8d3c8" opacity=".1"/></pattern>
</defs>
<rect width="1280" height="440" rx="24" fill="url(#bg)"/>
<rect width="1280" height="440" rx="24" fill="url(#grid)"/>
<ellipse cx="970" cy="225" rx="370" ry="300" fill="url(#glow)"/>
<rect x="1" y="1" width="1278" height="438" rx="23" fill="none" stroke="#426054" stroke-opacity=".7"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans CJK SC',Arial,sans-serif">
  <rect x="54" y="47" width="8" height="8" rx="2" fill="#b5f5bd"/>
  <text x="75" y="59" fill="#a5cbb8" font-size="15" letter-spacing="2">受 JEV 启发 · 基于官方 MLX-LM</text>
  <text x="48" y="224" fill="#f3f5e9" font-size="152" font-weight="750" letter-spacing="-7">MLX<tspan fill="#b5f5bd">J</tspan></text>
  <text x="57" y="281" fill="#dfebdd" font-size="27" font-weight="500">本地语义决策，为 Apple Silicon 而构建。</text>
  <text x="57" y="320" fill="#8bab9c" font-size="18">从当前状态，到一个允许的选择</text>
  <path d="M57 357 H637" stroke="#385247"/>
  <text x="57" y="397" fill="#abc7b5" font-size="13" letter-spacing="2.5">LOCAL INFERENCE</text>
  <text x="268" y="397" fill="#abc7b5" font-size="13" letter-spacing="2.5">STATE AWARE</text>
  <text x="458" y="397" fill="#abc7b5" font-size="13" letter-spacing="2.5">OPEN SOURCE</text>
</g>
<g font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace">
  <text x="762" y="60" fill="#829f90" font-size="12" letter-spacing="2">THE DECISION FLOW / SCHEMATIC</text>
  <rect x="758" y="91" width="406" height="71" rx="12" fill="#152f28" stroke="#42604f"/>
  <circle cx="784" cy="126" r="4" fill="#a6c4b0"/>
  <text x="803" y="132" fill="#d7e2d4" font-size="17">state: player / playing</text>
  <path d="M961 162 V186" stroke="#668975" stroke-width="1.5"/>
  <rect x="788" y="186" width="346" height="67" rx="12" fill="#1c3a2f" stroke="#52715b"/>
  <text x="813" y="227" fill="#f0eee0" font-size="20">“Pause it.”</text>
  <path d="M961 253 V283" stroke="#a2d9ab" stroke-width="1.5"/>
  <path d="m956 277 5 6 5 -6" fill="none" stroke="#a2d9ab" stroke-width="1.5"/>
  <rect x="758" y="287" width="406" height="88" rx="14" fill="#b5f5bd"/>
  <circle cx="797" cy="331" r="15" fill="#153d2a"/>
  <path d="m790 331 5 5 9 -10" fill="none" stroke="#b5f5bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="827" y="322" fill="#365d3c" font-size="12" letter-spacing="1.6">ALLOWED CHOICE</text>
  <text x="826" y="350" fill="#12341e" font-size="24" font-weight="650">player.pause</text>
  <text x="790" y="409" fill="#83a591" font-size="12">candidate ID · version · receipt</text>
</g>
</svg>
